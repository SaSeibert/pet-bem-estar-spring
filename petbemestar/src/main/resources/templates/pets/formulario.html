<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de pet</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>
    <h1>Cadastrar Novo pet</h1>

    <form th:action="@{/paginas/pets/novo}" th:object="${pet}" method="post">
		<div th:if="${erro}" style="color: red; margin-bottom: 15px; font-weight: bold; text-align: center;" th:text="${erro}"></div>
        
        <p>
            <label>Nome do pet</label>
            <input type="text" th:field="*{nome}">
            <span th:errors="*{nome}" style="color:red"></span>
        </p>

        <p>
            <label>Tutor</label>
            <select th:field="*{tutor.id}">
                <option value="">Selecione um tutor :</option>
                <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nome}"></option>
            </select>
            <span th:errors="*{tutor}" style="color:red"></span>
        </p>

        <p>
            <label>Especie</label>
            <select th:field="*{especie}">
                <option th:each="e : ${especies}" th:value="${e}" th:text="${e}"></option>
            </select>
            <span th:errors="*{especie}" style="color:red"></span>
        </p>

        <p>
            <label>Tamanho</label>
            <select th:field="*{tamanho}">
                <option th:each="tm : ${tamanhos}" th:value="${tm}" th:text="${tm}"></option>
            </select>
            <span th:errors="*{tamanho}" style="color:red"></span>
        </p>

        <button type="submit">Salvar</button>
        <a th:href="@{/paginas/pets}">Cancelar</a>
    </form>
</body>
</html>
